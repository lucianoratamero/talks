  <script>

    // Also available as an ES module, see:
    // https://revealjs.com/initialization/
    Reveal.initialize({
      controls: true,
      progress: true,
      center: true,
      hash: true,
      transition: 'concave',
      transitionSpeed: 'fast',
      autoAnimateDuration: 0.3,

      plugins: [RevealZoom, RevealNotes, RevealSearch, RevealMarkdown, RevealHighlight]

    // D flips light/dark on the fly (the dark styles hang off html.dark); listed in the ? help overlay
    Reveal.addKeyBinding({ keyCode: 68, key: 'D', description: 'Toggle dark mode' }, () => {
      document.documentElement.classList.toggle('dark');

    // `bullets: step` / `paragraphs: step` (whole talk, markdown slides only, so the Olá/Obrigado slides stay
    // put) or <!-- .slide: data-step --> (one slide, both) reveal list items / paragraphs one per click.
    // Done once the markdown has rendered: a `.element` comment on an item that contains a link or code
    // attaches to that link/code instead of the item.
    Reveal.on('ready', () => {
      const md = '.slides section[data-markdown-parsed]';
      document.querySelectorAll([

        `html[data-paragraphs="step"] ${md} p`,
        '.slides section[data-step] li',
        '.slides section[data-step] p',
      ].join(', ')).forEach((el) => {
        // speaker notes aren't on the slide, and a paragraph inside a list item steps with its item
        if (!el.closest('.notes') && !(el.tagName === 'P' && el.closest('li'))) el.classList.add('fragment');
      });
      Reveal.sync();

    // snap them back to their 3D spot without animating, so reveal's transition still swings them in/out;
    // park them again once the transition is over (the timeout covers changes that never fire transitionend).
    // Every level: slides above/below the current one in a vertical stack rotate in 3D too
    const sections = () => document.querySelectorAll('.reveal .slides section');
    const park = () => sections().forEach((s) => s.classList.toggle('parked', !s.classList.contains('present')));
    let parkLater;
    Reveal.on('ready', park);
    Reveal.on('slidetransitionend', park);
    Reveal.on('beforeslidechange', () => {
      const parked = document.querySelectorAll('.reveal .slides section.parked');

      document.body.offsetWidth; // apply the 3D spot now, so the transition starts from it
      parked.forEach((s) => { s.style.transition = ''; });

      range.selectNodeContents(el);
      const rects = [...range.getClientRects()].filter((r) => r.width);

      const animation = { duration, easing: config.autoAnimateEasing, fill: 'forwards' };
      const oldTexts = new Set([...fromSlide.children].map((el) => el.textContent));
      const newTexts = new Set([...toSlide.children].map((el) => el.textContent));
      const arrivals = changed(toSlide, oldTexts, fromSlide);
      for (const el of changed(fromSlide, newTexts, toSlide)) {

            node.classList.remove('fragment', 'visible', 'current-fragment');

          position: 'absolute',
          margin: '0',
          left: `${el.offsetLeft + fromSlide.offsetLeft - toSlide.offsetLeft}px`,
          top: `${el.offsetTop + fromSlide.offsetTop - toSlide.offsetTop}px`,
          width: `${el.offsetWidth}px`,
          textAlign: getComputedStyle(el).textAlign,
          pointerEvents: 'none',
        });

          // no fill: once done, the element's own CSS transforms (e.g. fragment styles) apply again
          arrival.animate([{ transform: `translate(${-x}px, ${-y}px)` }, { transform: 'none' }], { duration, easing: animation.easing });
        }
        ghost.animate([{ opacity: 1, transform: 'none' }, { opacity: 0, transform: move }], animation)
          .onfinish = () => ghost.remove();
      }
    });

  </script>

</body>
